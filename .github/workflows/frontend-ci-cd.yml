name: "Frontend CI/CD Pipeline"

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: "us-east-1"
  S3_BUCKET: "salma-realworld-frontend-253650698585"
  DOMAIN_NAME: "app.salmah.pp.ua"
  VITE_API_HOST: "https://api.app.salmah.pp.ua"

jobs:
  build-and-deploy:
    name: "Build Vue 3 SPA & Deploy to S3 + CloudFront"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: "Get pnpm store directory"
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: "Setup pnpm cache"
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: "Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Type Check"
        run: pnpm type-check

      - name: "Build Frontend for Production"
        env:
          VITE_API_HOST: ${{ env.VITE_API_HOST }}
        run: pnpm build

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Deploy Assets to S3"
        run: |
          echo "Syncing frontend dist/ to s3://${{ env.S3_BUCKET }}..."
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: "Invalidate CloudFront Cache"
        run: |
          CF_DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${{ env.DOMAIN_NAME }}')].Id" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "${CF_DIST_ID}" --paths "/*"

